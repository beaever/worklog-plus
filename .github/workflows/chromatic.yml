name: Chromatic

on:
  push:
    branches:
      - main
  # 시각 회귀 검사는 main에서만 동작. dev 및 dev 타깃 PR에서는 실행하지 않음
  pull_request:
    branches:
      - main

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Build Storybook and dependencies
        run: pnpm build --filter=@worklog-plus/storybook...
        env:
          NODE_ENV: production

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: apps/storybook/storybook-static
          # 모노레포: TurboSnap이 레포 루트 기준으로 파일을 추적하도록 Storybook 프로젝트 경로 지정
          storybookBaseDir: apps/storybook
          onlyChanged: true
          exitZeroOnChanges: true
          autoAcceptChanges: main
